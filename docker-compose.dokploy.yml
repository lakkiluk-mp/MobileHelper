services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      etalon-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://etalon:${POSTGRES_PASSWORD}@etalon-db:5432/etalon
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      VITE_AUTH_ENABLED: "true"
      APK_DIR: /data/apk
    volumes:
      - apk_builds:/data/apk
    expose:
      - "3000"
    networks:
      - etalon-internal
      - dokploy-network

  etalon-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etalon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: etalon
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etalon -d etalon"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etalon-internal

volumes:
  apk_builds:
  pg_data:

networks:
  etalon-internal:
    driver: bridge
  dokploy-network:
    external: true
